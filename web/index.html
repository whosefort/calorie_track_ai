<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дневник питания</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;background:var(--tg-theme-bg-color,#f5f6f4);color:var(--tg-theme-text-color,#17241b)}main{max-width:660px;margin:auto;padding:24px 18px}h1{font-size:28px;margin:0 0 5px}p,.muted{color:var(--tg-theme-hint-color,#69766d)}section{background:var(--tg-theme-secondary-bg-color,#fff);border-radius:18px;padding:18px;margin-top:18px}textarea,select,button{font:inherit;box-sizing:border-box;width:100%;border-radius:12px;padding:12px;border:1px solid #a9b5ac}textarea{resize:vertical;min-height:85px}select{margin-top:10px}button{margin-top:10px;background:var(--tg-theme-button-color,#297b51);color:var(--tg-theme-button-text-color,#fff);border:0;cursor:pointer}button:disabled{opacity:.6}.totals{display:flex;flex-wrap:wrap;gap:14px}.entry{padding:12px 0;border-top:1px solid #8884}.entry strong{display:block}.error{color:#d94b4b;white-space:pre-wrap}small{color:var(--tg-theme-hint-color,#69766d)}
</style></head><body><main><h1>Дневник питания</h1><p>Общий дневник с Telegram-ботом</p><div id="error" class="error" role="status"></div><section><h2>Добавить еду</h2><textarea id="text" maxlength="500" placeholder="Например: гречка 200 г и куриная грудка 150 г"></textarea><select id="meal"><option value="">Приём пищи не указан</option><option value="breakfast">Завтрак</option><option value="lunch">Обед</option><option value="dinner">Ужин</option><option value="snack">Перекус</option></select><button id="send">Рассчитать и сохранить</button><div id="result"></div></section><section><h2>Сегодня · UTC</h2><div id="totals" class="totals"></div></section><section><h2>История</h2><div id="history" class="muted">Загрузка…</div></section></main><script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand(); const init=tg?.initData||''; const error=document.querySelector('#error');
async function api(path,options={}){let r=await fetch('/web/api/'+path,{...options,headers:{'X-Telegram-Init-Data':init,'Content-Type':'application/json'}});let data=await r.json();if(!r.ok)throw Error(data.detail||'Ошибка запроса');return data}
function number(v){return Math.round((Number(v)||0)*10)/10} function node(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
async function load(){try{const rows=await api('history');const today=new Date().toISOString().slice(0,10);const sum=rows.filter(r=>r.date_utc===today).reduce((a,r)=>{for(const k of ['kcal','protein_g','fat_g','carb_g'])a[k]+=(r[k]||0);return a},{kcal:0,protein_g:0,fat_g:0,carb_g:0});document.querySelector('#totals').textContent=`${number(sum.kcal)} ккал · Б ${number(sum.protein_g)} г · Ж ${number(sum.fat_g)} г · У ${number(sum.carb_g)} г`;const h=document.querySelector('#history');h.replaceChildren();if(!rows.length)h.textContent='Записей пока нет';for(const r of rows){const e=node('div','');e.className='entry';e.append(node('strong',r.user_text),node('small',`${r.date_utc} · ${number(r.kcal)} ккал · Б ${number(r.protein_g)} · Ж ${number(r.fat_g)} · У ${number(r.carb_g)}`));h.append(e)}}catch(e){error.textContent=e.message}}
document.querySelector('#send').onclick=async()=>{const text=document.querySelector('#text').value.trim();if(!text)return;const button=document.querySelector('#send');button.disabled=true;button.textContent='Считаю…';error.textContent='';try{const result=await api('food',{method:'POST',body:JSON.stringify({text,meal_type:document.querySelector('#meal').value})});document.querySelector('#text').value='';document.querySelector('#result').textContent=`Сохранено: ${number(result.total_kcal)} ккал`;await load()}catch(e){error.textContent=e.message}finally{button.disabled=false;button.textContent='Рассчитать и сохранить'}};if(!init){error.textContent='Откройте это приложение из Telegram-бота.';document.querySelector('#send').disabled=true}else load();
</script></body></html>
